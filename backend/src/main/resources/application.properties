# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/logistics_db
spring.datasource.username=postgres
# (default password for PostgreSQL, change if you have set a different password)
# spring.datasource.password=postgres 
spring.datasource.password=Post@1234

# JPA Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

jwt.secret=mySuperSecretKey12345678901234567890
jwt.expiration=3600000

server.port=9090